<main class="container py-5 survey-container">
  <section class="mb-4 text-center text-md-start">
    <h1 class="text-primary fw-bold">{{ encuesta?.titulo }}</h1>
    <p class="fs-5 text-muted">Descripción: {{ encuesta?.descripcion}}</p>
  </section>

  <!-- Envolvemos con *ngIf para que no explote mientras las preguntas cargan -->
  <ng-container *ngIf="encuesta?.preguntas?.length; else loading">

    <!-- Progreso -->
    <section class="mb-4">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="text-uppercase fw-bold text-muted fs-7">Progreso</span>
        <span class="fw-bold text-primary fs-7">
          Pregunta {{ numeroPreguntaVisual }} de {{ encuesta?.preguntas?.length }}
        </span>
      </div>
      <div class="progress progress-custom">
        <div class="progress-bar progress-bar-brand" role="progressbar" [style.width.%]="progresoPorcentaje">
        </div>
      </div>
    </section>

    <!-- Tarjeta de Pregunta -->
    <section class="survey-card p-4 p-md-5 mb-4">
      <h2 class="fs-4 fw-semibold text-dark mb-5 text-center">
        <!-- ¡Aquí estaba el error! Cambiamos .texto por ?.enunciado -->
        {{ numeroPreguntaVisual }}. {{ encuesta.preguntas[indicePreguntaActual]?.enunciado }}
      </h2>

      <div class="d-flex flex-column align-items-center">
        <ng-container *ngIf="preguntaActual?.opciones?.length; else preguntaAbierta">
          <div class="d-flex flex-column w-100">
            <button *ngFor="let op of preguntaActual.opciones" type="button"
              class="btn btn-outline-primary btn-rounded-custom mb-2" [class.active]="respuestaSeleccionada === op.id"
              (click)="seleccionarCalificacion(op.id)">
              {{ op.texto }}
            </button>
          </div>
        </ng-container>

        <ng-template #preguntaAbierta>
          <textarea class="form-control w-100" rows="4" placeholder="Escribe tu respuesta..."
            [value]="textoRespuestaActual" (input)="actualizarTexto($any($event.target).value)"></textarea>
        </ng-template>
      </div>

    </section>

    <!-- Navegación -->
    <section class="d-flex flex-column flex-md-row justify-content-between gap-3 mt-4">
      <button class="btn btn-outline-primary btn-rounded-custom w-100 w-md-auto" (click)="anterior()"
        [disabled]="esPrimeraPregunta">
        ANTERIOR
      </button>

      <button class="btn btn-brand btn-rounded-custom w-100 w-md-auto text-white shadow" (click)="siguienteOFinalizar()"
        [disabled]="!puedeContinuar">
        {{ esUltimaPregunta ? 'FINALIZAR' : 'SIGUIENTE' }}
      </button>
    </section>

  </ng-container>

  <!-- Mensaje de carga mientras llegan los datos -->
  <ng-template #loading>
    <div class="text-center py-5 text-muted">
      <div class="spinner-border text-primary mb-3" role="status"></div>
      <p>Cargando preguntas...</p>
    </div>
  </ng-template>

</main>
