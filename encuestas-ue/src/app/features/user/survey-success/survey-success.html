<div class="d-flex flex-column align-items-center justify-content-center vh-100 bg-light">
  <div class="card shadow-sm p-5 text-center border-0 rounded-4" style="max-width: 420px;">
    <div class="mb-3">
      <span class="material-symbols-outlined text-success" style="font-size: 70px;">check_circle</span>
    </div>
    <h2 class="fw-bold mb-2">¡Encuesta completada!</h2>
    <p class="text-muted mb-4">Tus respuestas fueron registradas correctamente.</p>

    <div class="bg-light rounded-3 p-3 mb-4 text-start border">
      <div class="d-flex justify-content-between border-bottom pb-2 mb-2">
        <span class="text-muted small fw-semibold">Preguntas respondidas</span>
        <span class="fw-bold">{{ totalQuestions }}</span>
      </div>
      <div class="d-flex justify-content-between">
        <span class="text-muted small fw-semibold">Estado</span>
        <span class="text-success fw-bold">Finalizada</span>
      </div>
    </div>

    <a routerLink="/user/available-surveys" class="btn btn-primary w-100 py-2 fw-semibold rounded-pill">
      VOLVER A ENCUESTAS
    </a>
  </div>
</div>
