<div class="container py-4">
  <h2>{{ mode() === 'create' ? 'Crear Encuesta' : mode() === 'edit' ? 'Editar Encuesta' : 'Ver Encuesta' }}</h2>

  <form [formGroup]="surveyForm" (ngSubmit)="save()">
    <div class="mb-3">
      <label class="form-label">Título</label>
      <input type="text" class="form-control" formControlName="title">
    </div>

    <div class="mb-3">
      <label class="form-label">Descripción</label>
      <textarea class="form-control" formControlName="description"></textarea>
    </div>

    <!-- Contenedor del FormArray de Preguntas -->
    <div formArrayName="questions">
      @for (question of questions.controls; track $index) {
        <div [formGroupName]="$index" class="card p-3 mb-3">
          <label>Pregunta {{ $index + 1 }}</label>
          <input type="text" class="form-control" formControlName="text">

          <button type="button" class="btn btn-danger mt-2" (click)="removeQuestion($index)">
            Eliminar Pregunta
          </button>
        </div>
      }
    </div>

    <button type="button" class="btn btn-secondary" (click)="addQuestion()">Añadir Pregunta</button>
    <button type="submit" class="btn btn-primary" [disabled]="saving()">Guardar</button>
  </form>
</div>
