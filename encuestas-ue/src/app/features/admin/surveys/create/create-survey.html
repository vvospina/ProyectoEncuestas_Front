<div class="container py-4">
  <h2>{{ mode() === 'create' ? 'Crear Encuesta' : mode() === 'edit' ? 'Editar Encuesta' : 'Ver Encuesta' }}</h2>

  <form [formGroup]="surveyForm" (ngSubmit)="save()">
    <div class="mb-3">
      <label class="form-label fw-bold">Título</label>
      <input type="text" class="form-control" formControlName="title" placeholder="Ej: Evaluación de clima laboral">
    </div>

    <div class="mb-4">
      <label class="form-label fw-bold">Descripción</label>
      <textarea class="form-control" formControlName="description" rows="2" placeholder="Instrucciones breves de la encuesta..."></textarea>
    </div>

    <!-- Contenedor del FormArray de Preguntas -->
    <div formArrayName="questions">
      @for (question of questions.controls; track $index) {
        <div [formGroupName]="$index" class="card shadow-sm p-3 mb-3 border-secondary">
          <label class="form-label fw-bold text-primary">Pregunta {{ $index + 1 }}</label>
          <input type="text" class="form-control mb-3" formControlName="text" placeholder="Escribe aquí tu pregunta...">

          <div class="row mb-2">
            <!-- Selector de Tipo de Pregunta -->
            <div class="col-md-8">
              <label class="form-label text-muted small">Tipo de Pregunta</label>
              <select class="form-select" formControlName="type">
                @for (tipo of tiposPregunta; track tipo.value) {
                  <option [value]="tipo.value">{{ tipo.label }}</option>
                }
              </select>
            </div>

            <!-- Checkbox de Obligatoriedad -->
            <div class="col-md-4 d-flex align-items-end">
              <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" formControlName="required" [id]="'req-' + $index">
                <label class="form-check-label" [for]="'req-' + $index">
                  ¿Es obligatoria?
                </label>
              </div>
            </div>
          </div>

          <!-- Opciones para Selección Múltiple (Condicional) -->
          @if (question.get('type')?.value === 'SELECCION_MULTIPLE') {
            <div class="mt-3 p-3 bg-light rounded border">
              <label class="form-label small fw-bold">Opciones de respuesta (Ingresa una opción por línea)</label>
              <textarea class="form-control" formControlName="options" rows="3" placeholder="Opción A&#10;Opción B&#10;Opción C"></textarea>
            </div>
          }

          <!-- Botón Eliminar (Solo visible si no es modo lectura) -->
          @if (mode() !== 'view') {
            <button type="button" class="btn btn-outline-danger btn-sm mt-3 align-self-start" (click)="removeQuestion($index)">
              Eliminar Pregunta
            </button>
          }
        </div>
      }
    </div>

    <!-- Controles inferiores adaptables al modo -->
    @if (mode() !== 'view') {
      <div class="d-flex gap-2 mt-4 border-top pt-3">
        <button type="button" class="btn btn-secondary" (click)="addQuestion()">Añadir Otra Pregunta</button>
        <button type="submit" class="btn btn-success px-4" [disabled]="saving() || surveyForm.invalid">
          {{ saving() ? 'Guardando...' : 'Guardar Encuesta' }}
        </button>
      </div>
    } @else {
      <div class="mt-4 border-top pt-3">
        <button type="button" class="btn btn-primary" (click)="cancel()">Volver al Listado</button>
      </div>
    }
  </form>
</div>
