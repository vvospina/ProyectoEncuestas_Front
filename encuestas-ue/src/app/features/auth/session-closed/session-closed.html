<main class="session-closed-page">
  <section class="session-closed-card" aria-labelledby="session-closed-heading">

    <!-- Ícono de confirmación (Material Symbols) -->
    <div class="session-closed-icon" aria-hidden="true">
      <span class="material-symbols-outlined">check_circle</span>
    </div>

    <h1 id="session-closed-heading">Sesión cerrada correctamente</h1>

    <p class="session-closed-subtitle">
      Gracias por utilizar Encuestas UE. Tu sesión ha finalizado de forma segura.
    </p>

    <!-- Botón volver a iniciar sesión -->
    <a
      id="btn-volver-iniciar-sesion"
      routerLink="/login"
      class="back-to-login-button"
    >
      VOLVER A INICIAR SESIÓN
    </a>

  </section>
</main>
