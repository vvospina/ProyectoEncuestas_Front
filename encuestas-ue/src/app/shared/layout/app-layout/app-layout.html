<div class="app-shell">

  @if (sidebarOpen()) {
    <div
      class="sidebar-overlay"
      (click)="closeSidebar()"
      aria-hidden="true">
    </div>
  }

  <aside
    class="sidebar"
    [class.sidebar--open]="sidebarOpen()">

    <!-- HEADER -->
    <div class="sidebar__header">

      <div class="brand">
        <img
          class="brand__icon"
          src="/img/logo-uniempresarial-2.png"
          alt="Logo Uniempresarial" />

        <div class="brand__text">
          <strong>Encuestas UE</strong>
          <span>Plataforma académica</span>
        </div>
      </div>

      <button
        type="button"
        class="sidebar__close"
        (click)="closeSidebar()"
        aria-label="Cerrar menú">
        ×
      </button>

    </div>

    <!-- NAVEGACIÓN -->
    <nav class="sidebar__nav">

      <!-- ================================
           MENÚ ADMIN
      ================================= -->

      @if (isAdminSection) {

        <a
          routerLink="/admin/dashboard"
          routerLinkActive="nav-item--active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-item"
          (click)="closeSidebar()">

          <span class="nav-item__icon">⌂</span>
          <span>Dashboard</span>

        </a>

        <a
          routerLink="/admin/surveys"
          routerLinkActive="nav-item--active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-item"
          (click)="closeSidebar()">

          <span class="nav-item__icon">☷</span>
          <span>Encuestas</span>

        </a>

        <a
          routerLink="/admin/teachers"
          routerLinkActive="nav-item--active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-item"
          (click)="closeSidebar()">

          <span class="nav-item__icon">♙</span>
          <span>Docentes</span>

        </a>

      }

      <!-- ================================
           MENÚ USER
      ================================= -->

      @else {

        <a
          routerLink="/user/surveys"
          routerLinkActive="nav-item--active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-item"
          (click)="closeSidebar()">

          <span class="nav-item__icon">☷</span>
          <span>Encuestas</span>

        </a>

        <a
          routerLink="/user/responses"
          routerLinkActive="nav-item--active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-item"
          (click)="closeSidebar()">

          <span class="nav-item__icon">✓</span>
          <span>Mis respuestas</span>

        </a>

      }

    </nav>

    <!-- FOOTER -->
    <div class="sidebar__footer">

      <button
        type="button"
        class="logout-button"
        (click)="logout()">

        <span class="nav-item__icon">↪</span>
        <span>Cerrar sesión</span>

      </button>

    </div>

  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main-content">

    <header class="topbar">

      <button
        type="button"
        class="menu-button"
        (click)="toggleSidebar()"
        aria-label="Abrir menú">

        ☰

      </button>

      <div class="topbar__title">
        <span>Encuestas</span>
        <img
          class="topbar__logo"
          src="/img/logo-uniempresarial-2.png"
          alt="UE" />
      </div>

    </header>

    <section class="page-content">
      <router-outlet />
    </section>

  </main>

</div>
